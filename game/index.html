<body>
<main id="frame" aria-label="Ember &amp; Tide">
  <div class="corners" aria-hidden="true"></div>
  <header><span class="brand">◈ &nbsp; EMBER <i>&amp;</i> TIDE</span><span class="edition">THE SOLSTICE DUEL <b>✦</b> THE ASTRAL RING</span><button id="sound" aria-pressed="true">♪ SOUND</button></header>
  <section id="table" hidden></section>
  <section id="overlay"></section>
  <footer><span>✧ &nbsp; THE SOLSTICE DUEL</span><span id="hint">ENTER &nbsp; BEGIN DUEL</span><span>EMBER / TIDE / THORN / STAR &nbsp; ✧</span></footer>
</main>
<script>
'use strict';
const cards = [
  ['Ember Bolt','Ember',1,['damage',3]],
  ['Flame Wave','Ember',2,['damage',5]],
  ['Inferno','Ember',3,['damage',8]],
  ['Kindling Curse','Ember',1,['burn',2]],
  ['Tide Lance','Tide',1,['damage',3]],
  ['Crushing Surf','Tide',2,['damage',5]],
  ['Healing Rain','Tide',2,['heal',5]],
  ['Deep Spring','Tide',1,['heal',3]],
  ['Thorn Guard','Thorn',1,['shield',4]],
  ['Briar Wall','Thorn',2,['shield',7]],
  ['Vine Lash','Thorn',1,['damage',2],['draw',1]],
  ['Star Fall','Star',3,['damage',7]],
  ['Star Mend','Star',2,['heal',4],['shield',2]],
  ['Comet Spark','Star',1,['damage',2]],
  ['Moon Draught','Star',1,['draw',2]],
  ['Ash Phoenix','Ember',3,['damage',6],['burn',1]],
].map(([name,element,cost,...effects]) => ({name,element,cost,effects}));

function mulberry32(a) {
  return () => {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(pile, next) {
  for (let i=pile.length-1; i>0; i--) {
    const j = Math.floor(next() * (i+1));
    [pile[i],pile[j]] = [pile[j],pile[i]];
  }
  return pile;
}
const points = (card,kind) => card.effects.find(([k]) => k === kind)?.[1] ?? 0;
function createDuel(seed, sound = () => {}) {
  seed = seed >>> 0;
  function mage(name, stream) {
    const next = mulberry32(stream >>> 0);
    return {name,life:20,shield:0,burn:0,energy:0,hand:[],deck:shuffled([...cards,...cards],next),discard:[],next};
  }
  const player = mage('Marin',seed), rival = mage('Pyra',seed+7919);
  const log = [];
  const duel = {player,rival,log,round:1,winner:null,finisher:'',play,end};
  const record = (who,card,detail) => log.push({round:duel.round,who,card,detail});
  function draw(m,n) {
    let count = 0;
    while (count<n && m.hand.length<5) {
      if (!m.deck.length) m.deck = shuffled(m.discard.splice(0),m.next);
      if (!m.deck.length) break;
      m.hand.push(m.deck.shift());
      count++;
    }
    return count;
  }
  function damage(m,n) {
    const block = Math.min(m.shield,n), loss = Math.min(m.life,n-block);
    m.shield -= block;
    m.life -= loss;
    if (loss) sound('hurt');
    return [loss && `−${loss} Life`,block && `−${block} Shield`].filter(Boolean).join(' / ');
  }
  function finish(winner,card) {
    duel.winner = winner;
    duel.finisher = card;
    sound(winner === player ? 'win' : 'loss');
  }
  function start(m,other) {
    m.energy = 3;
    draw(m,1);
    if (m.burn) {
      const detail = damage(m,m.burn--);
      record(m.name,'Burn ticks',detail);
      if (!m.life) finish(other,'Burn');
    }
  }
  function cast(m,other,index) {
    const card = m.hand[index];
    if (duel.winner || !card || card.cost>m.energy) return false;
    m.energy -= card.cost;
    m.hand.splice(index,1);
    sound('play');
    const changes = [];
    for (const [kind,n] of card.effects) {
      if (kind==='damage') changes.push(damage(other,n));
      if (kind==='burn') { other.burn += n; changes.push(`+${n} Burn`); }
      if (kind==='shield') { m.shield += n; changes.push(`+${n} Shield`); }
      if (kind==='heal') { const gain=Math.min(20-m.life,n); m.life+=gain; changes.push(`+${gain} Life`); }
      if (kind==='draw') changes.push(`Draw ${draw(m,n)}`);
      if (!other.life) break;
    }
    record(m.name,card.name,changes.filter(Boolean).join(' · '));
    m.discard.push(card);
    if (!other.life) finish(m,card.name);
    return true;
  }
  function play(index) { return cast(player,rival,index); }
  function end() {
    if (duel.winner) return;
    start(rival,player);
    while (!duel.winner) {
      const legal = rival.hand.filter(c=>c.cost<=rival.energy);
      const high = kind => legal.filter(c=>points(c,kind)).sort((a,b)=>b.cost-a.cost)[0];
      const effectiveLife = player.life+player.shield;
      const lethal = legal.find(c=>points(c,'damage')>=effectiveLife);
      const pair = !lethal && legal.flatMap((a,i)=>legal.slice(i+1).map(b=>[a,b])).find(([a,b])=>
        a.cost+b.cost<=rival.energy && points(a,'damage')+points(b,'damage')>=effectiveLife);
      if (pair) {
        for (const card of pair) cast(rival,player,rival.hand.indexOf(card));
        continue;
      }
      const heal = rival.life<=8 && legal.filter(c=>points(c,'heal')).sort((a,b)=>a.cost-b.cost)[0];
      const choice = lethal || heal || high('damage') || high('shield') || legal[0];
      if (!choice) break;
      cast(rival,player,rival.hand.indexOf(choice));
    }
    if (!duel.winner) { duel.round++; start(player,rival); }
  }
  draw(player,5);
  draw(rival,5);
  start(player,rival);
  return duel;
}
// INTERFACE
const query = new URLSearchParams(location.search);
const scene = query.get('shot');
const seed = Number(query.get('seed') ?? (scene==='play' ? 278 : 1)) >>> 0;
const table=document.querySelector('#table'), overlay=document.querySelector('#overlay');
const hint=document.querySelector('#hint'), soundButton=document.querySelector('#sound');
const glyph=kind=>`<span class="glyph ${kind.toLowerCase()}" aria-hidden="true"></span>`;
const effectWords={damage:'Deal',burn:'Burn',heal:'Heal',shield:'Shield',draw:'Draw'};
const replayMoves={
  // Digits are hand keys; zero ends the round. No replay changes a mage directly.
  play:[2,4,0,3,0,2,1,0,3,0,1,1,0],
  win:[5,2,0,4,2,0,1,2,0,2,3,0,5,4,0,1,0,4,2,0,1],
  loss:[4,0,4,4,0,1,1,0,1,1,0,3,4,3,0,1,0,1,0],
};
let duel=null, audio=null, audible=true;
const sounds={play:[392,586],hurt:[178,118],win:[392,494,587,784],loss:[330,262,196,131]};
function wakeAudio(){
  if(!audible || !window.AudioContext) return;
  audio ??= new AudioContext();
  if(audio.state==='suspended') audio.resume().catch(()=>{});
}
function tone(event){
  if(!audible || audio?.state!=='running') return;
  sounds[event].forEach((hz,i)=>{
    const at=audio.currentTime+i*((event==='hurt' || event==='play') ? .045 : .105);
    const osc=audio.createOscillator(), gain=audio.createGain();
    osc.type=event==='hurt'?'triangle':'sine';
    osc.frequency.value=hz;
    gain.gain.setValueAtTime(.001,at);
    gain.gain.exponentialRampToValueAtTime(.11,at+.012);
    gain.gain.exponentialRampToValueAtTime(.001,at+.22);
    osc.connect(gain).connect(audio.destination);
    osc.start(at);
    osc.stop(at+.23);
  });
}
function cardMarkup(card,index,energy=3){
  return `<button class="card ${card.element.toLowerCase()}" data-index="${index}" ${card.cost>energy?'disabled':''}><span class="cost" aria-label="Cost ${card.cost}">${card.cost}</span><span class="key">KEY ${index+1}</span>${glyph(card.element)}<span class="element">${card.element}</span><strong class="card-name">${card.name}</strong><span class="effects">${card.effects.map(([kind,n])=>`<span>${effectWords[kind]} <b>${n}</b></span>`).join('')}</span></button>`;
}
function chronicle(entries){
  return `<div class="log" aria-label="Battle log"><span class="label">Battle log · Last three spells</span>${entries.length?entries.slice(-3).map(e=>`<div class="log-row"><time>R${String(e.round).padStart(2,'0')}</time><b class="${e.who}">${e.who}</b><strong>${e.card}</strong><span>${e.detail}</span></div>`).join(''):'<p class="log-empty">The ring waits for your opening spell.</p>'}</div>`;
}
const subtitle=m=>m.name==='Marin'?'THE TIDE CALLER':'THE EMBER WITCH';
function rail(m){
  const marine=m.name==='Marin';
  return `<div class="rail ${marine?'marine':''}" aria-label="${m.name}, Life ${m.life}, Shield ${m.shield}, Burn ${m.burn}"><div class="portrait">${glyph(marine?'Tide':'Ember')}</div><div class="marshal"><span class="eyebrow">${marine?'YOU · PLAYER':'CPU · OPPONENT'}</span><strong>${m.name.toUpperCase()}</strong><small>${subtitle(m)}</small></div><div class="stats">${['life','shield','burn'].map(k=>`<div class="stat ${k==='burn'&&m[k]?'lit':''}"><b data-stat="${k}">${m[k]}</b><span>${k}</span></div>`).join('')}</div></div>`;
}
function paintTable(){
  const {player:p,rival:r,round,log}=duel;
  table.hidden=false;
  overlay.hidden=true;
  hint.textContent='KEYS 1–5  ·  CAST SPELL     /     SPACE  ·  END TURN';
  table.innerHTML=`
    <div class="foe">${rail(r)}<div class="rack"><div class="rack-copy"><span class="label">Pyra’s hand</span><strong>Veiled spells</strong><small>${r.hand.length} in hand &nbsp; / &nbsp; ${r.deck.length} in deck</small></div><div class="backs" aria-label="${r.hand.length} face-down cards">${Array.from({length:5},(_,i)=>`<div class="back ${i>=r.hand.length?'spent':''}" aria-hidden="true">${glyph(i<r.hand.length?'Moon':'Star')}</div>`).join('')}</div></div></div>
    <div class="middle">${chronicle(log)}<div class="turnbox"><div><span class="label">The Astral Ring</span><strong>Round ${String(round).padStart(2,'0')}</strong><small>Marin to act · Pyra replies after you</small></div><div class="turn-emblem">${glyph('Star')}</div></div><div class="turnbox energy"><div><span class="label">Your energy</span><strong id="energy">${p.energy}<small> / 3</small></strong></div><div class="pips" aria-hidden="true">${Array.from({length:3},(_,i)=>`<span class="pip ${i<p.energy?'on':''}"></span>`).join('')}</div></div></div>
    <div class="bottom">${rail(p)}<div class="hand" aria-label="Your hand">${p.hand.map((c,i)=>cardMarkup(c,i,p.energy)).join('')}${p.hand.length<5?`<div class="archive" aria-label="Your draw pile">${glyph('Moon')}<strong>${p.deck.length}</strong><span class="label">Draw pile</span><small>${p.discard.length} DISCARDED</small></div>`:''}</div><div class="command"><span class="label">Pass to Pyra</span><button class="gold-button" id="end">END TURN</button><small>SPACE BAR</small></div></div>`;
}
function seal(name,element,life){
  const sea=element==='Tide';
  return `<aside class="seal ${sea?'sea':''} ${life===0?'fallen':''}"><div class="sigil">${glyph(element)}</div><strong>${name}</strong><small>${sea?'THE TIDE CALLER':'THE EMBER WITCH'}</small>${life!==undefined?`<div class="final-life">${life} <small> LIFE</small></div>`:''}</aside>`;
}
function paintOverlay(){
  table.hidden=true;
  overlay.hidden=false;
  const done=duel?.winner, win=done===duel?.player;
  const center=done ? `<div class="hero result ${win?'':'loss'}"><span class="label">Duel complete · Round ${duel.round}</span><h1>${win?'VICTORY':'DEFEAT'}</h1><h2>${win?'Pyra falls':'Marin falls'}</h2><div class="ruleline">✦ &nbsp; FINAL SPELL: ${duel.finisher.toUpperCase()} &nbsp; ✦</div>${chronicle(duel.log)}<button class="gold-button" id="begin">REMATCH</button><span class="prompt">Click or press Enter to duel again</span></div>` : `<div class="hero"><span class="label">A spellcraft game for one challenger</span><h1>EMBER <i>&amp;</i> TIDE</h1><h2>An Arcane Card Duel</h2><div class="ruleline">✦</div><p>Spend 3 Energy a turn on spells — Shield soaks damage before Life, and the first mage to fall loses.<br>Click a card or press 1–5 to play it; Space ends your turn.</p><button class="gold-button" id="begin">ENTER THE RING</button><span class="prompt">Click or press Enter to begin</span></div>`;
  overlay.innerHTML=seal('PYRA','Ember',done?duel.rival.life:undefined)+center+seal('MARIN','Tide',done?duel.player.life:undefined);
  hint.textContent=done?'ENTER  ·  REMATCH':'ENTER  ·  BEGIN DUEL';
}
function paint(){ if(duel && !duel.winner) paintTable(); else paintOverlay(); }
function begin(){ wakeAudio(); duel=createDuel(seed,tone); paint(); }
function act(key){
  if(!duel || duel.winner) return;
  wakeAudio();
  if(key===0) { duel.end(); paint(); }
  else if(duel.play(key-1)) paint();
}
document.addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(button===soundButton){
    audible=!audible;
    soundButton.setAttribute('aria-pressed',String(audible));
    soundButton.textContent=audible?'♪ SOUND':'♪ SOUND OFF';
    if(audible) wakeAudio();
    soundButton.blur();
  } else if(button?.id==='begin') begin();
  else if(button?.id==='end') act(0);
  else if(button?.matches('.card') && button.closest('#table')) act(Number(button.dataset.index)+1);
});
document.addEventListener('keydown',event=>{
  if(event.repeat || event.altKey || event.ctrlKey || event.metaKey || scene==='atlas') return;
  if(event.key==='Enter' && (!duel || duel.winner) && event.target!==soundButton){ event.preventDefault(); begin(); }
  const interactive='button, a[href], input, select, textarea, summary, [contenteditable]:not([contenteditable="false"]), [role="button"], [role="link"]';
  if(duel && !duel.winner && event.key===' ' && !event.target.closest?.(interactive) && !document.activeElement?.closest(interactive)){
    event.preventDefault(); act(0);
  }
  if(duel && !duel.winner && /^[1-5]$/.test(event.key)){ event.preventDefault(); act(Number(event.key)); }
});
if(scene==='atlas'){
  overlay.hidden=true;
  hint.textContent='CARD LIBRARY  ·  SIXTEEN SPELLS';
  const atlas=document.createElement('section');
  atlas.className='atlas'; atlas.setAttribute('aria-label','Card library');
  atlas.innerHTML=[cards.slice(0,8),cards.slice(8)].map(row=>`<div class="hand">${row.map((c,i)=>cardMarkup(c,i%5)).join('')}</div>`).join('');
  document.querySelector('#frame').append(atlas);
} else {
  if(Object.hasOwn(replayMoves,scene)){
    duel=createDuel(seed,tone);
    for(const key of replayMoves[scene]) {
      if(duel.winner) break;
      if(key===0) duel.end(); else duel.play(key-1);
    }
  }
  paint();
}
</script>
</body>
</html>
